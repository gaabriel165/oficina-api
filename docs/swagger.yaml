      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a part
      tags:
      - parts
  /parts/{id}/stock:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Part ID
        in: path
        name: id
        required: true
        type: string
      - description: Stock data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateStockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
