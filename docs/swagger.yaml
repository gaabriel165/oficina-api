        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add stock quantity to a part
      tags:
      - parts
  /service-orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ServiceOrderResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all service orders
      tags:
      - service-orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Service order data
        in: body
        name: body
        required: true
