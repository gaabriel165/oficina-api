name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/domain/... ./internal/application/... ./internal/api/... ./internal/infrastructure/observability/...

      - name: Integration tests
        run: go test ./internal/integration/... -timeout 300s

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/overlays/prod > /dev/null
          kubectl kustomize k8s/overlays/homolog > /dev/null

      - name: Build Docker image
        run: docker build -t oficina-api:ci .
