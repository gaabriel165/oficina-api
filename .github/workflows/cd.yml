name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Install metrics-server
        run: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Create namespace and application secret
        run: |
          kubectl create namespace oficina-api --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oficina-api-secrets \
            --namespace oficina-api \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          sed -i "s|ECR_REPOSITORY_URL|${{ vars.ECR_REPOSITORY_URL }}|; s|newTag: latest|newTag: ${{ github.sha }}|" k8s/kustomization.yaml
          kubectl apply -k k8s/
          kubectl rollout status deployment/oficina-api --namespace oficina-api --timeout=300s
