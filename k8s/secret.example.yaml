# Template only — do NOT apply with real values committed.
# In CI the Secret is created from GitHub Secrets + the Terraform database_url output:
#
#   kubectl create secret generic oficina-api-secrets \
#     --namespace oficina-api \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET" \
#     --from-literal=RESEND_API_KEY="$RESEND_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
  namespace: oficina-api
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@RDS_ENDPOINT:5432/oficina_mecanica?sslmode=require"
  JWT_SECRET: "change-me"
  WEBHOOK_SECRET: "change-me"
  RESEND_API_KEY: "re_change_me"
