# Template only. The CD creates the real Secret from SSM Parameter Store
# (database_url, jwt_secret, webhook_secret) and GitHub Secrets
# (RESEND_API_KEY, NEW_RELIC_LICENSE_KEY). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@RDS_ENDPOINT:5432/oficina_mecanica?sslmode=require"
  JWT_SECRET: "change-me"
  WEBHOOK_SECRET: "change-me"
  RESEND_API_KEY: "re_change_me"
  OTEL_EXPORTER_OTLP_HEADERS: "api-key=NEW_RELIC_LICENSE_KEY"
